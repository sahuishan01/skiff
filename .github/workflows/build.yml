name: Build & Release Skiff Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-kotlin-app:
    name: Build Kotlin App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode release signing keystore
        env:
          SKIFF_KEYSTORE_BASE64: ${{ secrets.SKIFF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SKIFF_KEYSTORE_BASE64" ]; then
            echo "$SKIFF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skiff-release.keystore"
            echo "SKIFF_KEYSTORE_FILE=$RUNNER_TEMP/skiff-release.keystore" >> "$GITHUB_ENV"
            echo "SKIFF_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing keystore secret set: building an unsigned APK and skipping the release."
          fi

      - name: Build Android App (Release APK)
        env:
          SKIFF_KEYSTORE_PASSWORD: ${{ secrets.SKIFF_KEYSTORE_PASSWORD }}
          SKIFF_KEY_ALIAS: ${{ secrets.SKIFF_KEY_ALIAS }}
          SKIFF_KEY_PASSWORD: ${{ secrets.SKIFF_KEY_PASSWORD }}
        run: |
          cd trans_decoder_app
          # Generate gradle wrapper dynamically using Gradle 8.4
          gradle wrapper
          chmod +x gradlew
          # Capture output to log file to allow remote debugging on failure
          ./gradlew assembleRelease > ../build.log 2>&1
          
          # Extract version name from build.gradle.kts
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_FILE=skiff-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK version: $VERSION"

          # Copy compiled APK to target release path
          mkdir -p app/build/outputs/apk/release
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} "app/build/outputs/apk/release/skiff-${VERSION}.apk" \;

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "Skiff Developer"
          git config user.email "developer@skiff.p2p"
          # Create and force-push to a debug branch (force recreate if exists)
          git checkout -B ci-debug
          cp build.log ci_build_error.log || true
          git add ci_build_error.log
          git commit -m "Upload failed build logs for debug"
          git push -f origin ci-debug

      - name: Create GitHub Release
        if: env.SKIFF_SIGNED == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            trans_decoder_app/app/build/outputs/apk/release/skiff-${{ env.VERSION }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
